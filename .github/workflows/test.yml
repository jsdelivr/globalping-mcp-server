name: Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create .dev.vars for integration tests
        run: |
          cat > .dev.vars << 'EOF'
          GLOBALPING_CLIENT_ID=test-client-id
          GLOBALPING_API_TOKEN=test-token-for-ci-environment
          EOF

      - name: Run TypeScript checks
        run: |
          npx tsc --noEmit
          npx tsc -p test/integration/tsconfig.json --noEmit

      - name: Verify generated Worker types
        run: npx wrangler types --check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
